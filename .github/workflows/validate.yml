name: Validate

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  agent-skills:
    name: Agent skills
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show GitHub CLI version
        run: gh --version

      - name: Validate skill publishing metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh skill publish --dry-run
